
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Basanta Model - AI assistant">
<title>Basanta Model</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#111;color:#eee;font-family:Arial,Helvetica,sans-serif;height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100dvh;width:100%}
.sidebar{width:270px;background:#080808;border-right:1px solid #292929;display:flex;flex-direction:column;padding:14px;gap:12px;transition:transform .25s;z-index:5}
.brand{font-size:22px;font-weight:bold;padding:12px 5px}
.newchat,.sidebtn{background:#191919;color:#eee;border:1px solid #333;border-radius:10px;padding:12px;text-align:left;width:100%}
.newchat:hover,.sidebtn:hover{background:#292929}
.search{width:100%;background:#171717;color:white;border:1px solid #333;padding:11px;border-radius:9px;outline:none}
.history{overflow:auto;flex:1}
.chatitem{padding:11px;border-radius:9px;display:flex;align-items:center;gap:8px;margin:3px 0;color:#ccc}
.chatitem.active,.chatitem:hover{background:#222}
.chatname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smallbtn{background:none;color:#aaa;border:0;padding:4px}
.sidebarbottom{display:grid;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{min-height:58px;border-bottom:1px solid #292929;display:flex;align-items:center;padding:0 14px;gap:12px}
.menu{background:none;border:0;color:white;font-size:23px}
.topname{font-size:17px;font-weight:bold}
.language{margin-left:auto;background:#1b1b1b;color:white;border:1px solid #333;border-radius:8px;padding:8px;max-width:125px}
.drivebtn{background:#202020;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 10px;white-space:nowrap}
.messages{flex:1;overflow-y:auto;padding:22px 15px 30px;display:flex;flex-direction:column;gap:22px}
.welcome{margin:auto;text-align:center;max-width:550px;padding:25px}
.welcome h1{font-size:30px;margin-bottom:8px}
.welcome p{color:#aaa;line-height:1.6}
.message{width:100%;max-width:850px;margin:0 auto}
.bubble{padding:14px 17px;border-radius:16px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}
.user .bubble{background:#252525;margin-left:auto;max-width:85%;width:fit-content}
.assistant .bubble{background:transparent;padding-left:0;padding-right:0}
.msgactions{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.msgactions button{color:#aaa;background:#1c1c1c;border:1px solid #333;border-radius:7px;padding:6px 9px;font-size:12px}
.msgimage{max-width:220px;max-height:220px;border-radius:10px;display:block;margin-bottom:8px}
.composer-area{padding:10px 15px 15px}
.composer{max-width:850px;margin:auto;background:#1b1b1b;border:1px solid #3b3b3b;border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px}
#prompt{width:100%;resize:none;min-height:48px;max-height:150px;background:transparent;color:white;border:0;outline:none;padding:8px;font-size:16px}
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.toolbtn{background:#292929;color:#eee;border:0;border-radius:9px;padding:9px 11px}
.send{margin-left:auto;background:white;color:black;border:0;border-radius:10px;padding:10px 17px;font-weight:bold}
#fileInput{display:none}
.status{text-align:center;color:#888;font-size:12px;padding:5px}
@media(max-width:700px){
 .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);width:280px}
 .sidebar.open{transform:translateX(0)}
 .messages{padding:18px 13px}
 .composer-area{padding:8px}
 .welcome h1{font-size:25px}
 .topbar{gap:7px;padding:0 9px}
 .drivebtn{padding:8px 7px;font-size:12px}
 .language{padding:7px;font-size:12px}
 .topname{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand">✦ Basanta Model</div>
 <button class="newchat" onclick="newChat()">＋ New chat</button>
 <input class="search" id="search" placeholder="Search chats..." oninput="renderHistory()">
 <div class="history" id="history"></div>
 <div class="sidebarbottom">
  <button class="sidebtn" onclick="exportHistory()">↓ Export conversations</button>
  <button class="sidebtn" onclick="backupNow()">☁ Back up to Google Drive</button>
  <button class="sidebtn" onclick="clearHistory()">Clear all history</button>
 </div>
</aside>

<main class="main">
 <header class="topbar">
  <button class="menu" onclick="toggleSidebar()">☰</button>
  <div class="topname">Basanta Model</div>
  <button class="drivebtn" id="driveBtn" onclick="connectDrive()">Connect Drive</button>
  <select class="language" id="language">
   <option value="auto">Auto language</option>
   <option value="English">English</option>
   <option value="Hindi">हिन्दी</option>
  </select>
 </header>

 <section class="messages" id="messages">
  <div class="welcome">
   <h1>Welcome to Basanta ✦</h1>
   <p>Your AI assistant. Ask questions, learn something new, upload files or talk using your voice.</p>
  </div>
 </section>

 <div class="composer-area">
  <div class="composer">
   <div id="attachment"></div>
   <textarea id="prompt" rows="1" placeholder="Message Basanta..."></textarea>
   <div class="tools">
    <button class="toolbtn" onclick="document.getElementById('fileInput').click()">＋ File</button>
    <button class="toolbtn" onclick="openCamera()">📷 Camera</button>
    <button class="toolbtn" onclick="startVoice()">🎙 Voice</button>
    <button class="toolbtn" onclick="toggleSpeech()">🔊 Voice on/off</button>
    <input id="fileInput" type="file" accept="image/*,.pdf,.txt,.docx" multiple onchange="handleFiles(event)">
    <button class="send" id="sendBtn" onclick="sendMessage()">Send ↑</button>
   </div>
  </div>
  <div class="status" id="status">Basanta AI • English and Hindi</div>
 </div>
</main>
</div>

<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden onchange="handleFiles(event)">

<script>
const API_BASE="https://basanta-model-api.ronitklenka.workers.dev";
const API_URL=API_BASE+"/api/chat";
const DRIVE_STATUS_URL=API_BASE+"/api/drive/status";
const DRIVE_UPLOAD_URL=API_BASE+"/api/drive/upload";
const DRIVE_BACKUP_URL=API_BASE+"/api/drive/backup";
const STORAGE_KEY="basanta_model_chats_v1";

let chats=loadChats();
let currentId=null;
let attachments=[];
let speechEnabled=true;
let busy=false;
let driveConnected=false;
let backupTimer=null;

if(window.pdfjsLib){
 pdfjsLib.GlobalWorkerOptions.workerSrc=
 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function loadChats(){
 try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}
 catch(e){return []}
}

function saveChats(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(chats));
  scheduleDriveBackup();
 }catch(e){
  setStatus("Phone storage is full. Export or delete old conversations.");
 }
}

function makeId(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function activeChat(){
 return chats.find(c=>c.id===currentId);
}

function newChat(){
 const chat={id:makeId(),title:"New chat",messages:[],updated:Date.now()};
 chats.unshift(chat);
 currentId=chat.id;
 attachments=[];
 document.getElementById("attachment").innerHTML="";
 saveChats();
 renderHistory();
 renderMessages();
 closeSidebar();
}

function selectChat(id){
 currentId=id;
 renderHistory();
 renderMessages();
 closeSidebar();
}

function renderHistory(){
 const container=document.getElementById("history");
 const query=document.getElementById("search").value.toLowerCase();
 container.innerHTML="";

 chats.filter(c=>
  (c.title||"").toLowerCase().includes(query)||
  (c.messages||[]).some(m=>(m.text||"").toLowerCase().includes(query))
 ).forEach(chat=>{
  const row=document.createElement("div");
  row.className="chatitem"+(chat.id===currentId?" active":"");

  const name=document.createElement("span");
  name.className="chatname";
  name.textContent=chat.title||"Untitled";
  name.onclick=()=>selectChat(chat.id);

  const rename=document.createElement("button");
  rename.className="smallbtn";
  rename.textContent="✎";
  rename.title="Rename";
  rename.onclick=()=>{
   const value=prompt("Enter conversation name:",chat.title);
   if(value&&value.trim()){
    chat.title=value.trim();
    saveChats();
    renderHistory();
   }
  };

  const del=document.createElement("button");
  del.className="smallbtn";
  del.textContent="×";
  del.title="Delete";
  del.onclick=()=>{
   if(confirm("Delete this conversation?")){
    chats=chats.filter(c=>c.id!==chat.id);
    if(currentId===chat.id)currentId=null;
    saveChats();
    renderHistory();
    renderMessages();
   }
  };

  row.append(name,rename,del);
  container.appendChild(row);
 });
}

function renderMessages(){
 const area=document.getElementById("messages");
 area.innerHTML="";
 const chat=activeChat();

 if(!chat||!chat.messages.length){
  const welcome=document.createElement("div");
  welcome.className="welcome";
  welcome.innerHTML="<h1>Welcome to Basanta ✦</h1><p>Your AI assistant. Ask questions, learn something new, upload files or talk using your voice.</p>";
  area.appendChild(welcome);
  return;
 }

 chat.messages.forEach((msg,index)=>addMessageElement(msg,index));
 area.scrollTop=area.scrollHeight;
}

function addMessageElement(msg,index){
 const area=document.getElementById("messages");
 const wrap=document.createElement("div");
 wrap.className="message "+msg.role;

 const bubble=document.createElement("div");
 bubble.className="bubble";

 if(msg.image){
  const img=document.createElement("img");
  img.src=msg.image;
  img.className="msgimage";
  bubble.appendChild(img);
 }

 const text=document.createElement("div");
 text.textContent=msg.text||"";
 bubble.appendChild(text);
 wrap.appendChild(bubble);

 if(msg.role==="assistant"){
  const actions=document.createElement("div");
  actions.className="msgactions";

  const copy=document.createElement("button");
  copy.textContent="Copy";
  copy.onclick=()=>copyText(msg.text||"");

  const speak=document.createElement("button");
  speak.textContent="🔊 Listen";
  speak.onclick=()=>speakText(msg.text||"");

  const regen=document.createElement("button");
  regen.textContent="Regenerate";
  regen.onclick=()=>regenerate(index);

  actions.append(copy,speak,regen);
  wrap.appendChild(actions);
 }

 area.appendChild(wrap);
}

function addStoredMessage(role,text,image=null){
 const chat=activeChat();
 if(!chat)return;

 chat.messages.push({role,text,image});
 chat.updated=Date.now();

 if(chat.title==="New chat"&&role==="user"){
  chat.title=(text||"Image conversation").slice(0,35);
 }

 saveChats();
 addMessageElement({role,text,image},chat.messages.length-1);
 document.getElementById("messages").scrollTop=
 document.getElementById("messages").scrollHeight;
 renderHistory();
}

function setStatus(text){
 document.getElementById("status").textContent=text;
}

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("open");
}

function closeSidebar(){
 document.getElementById("sidebar").classList.remove("open");
}

function copyText(text){
 if(navigator.clipboard){
  navigator.clipboard.writeText(text)
   .then(()=>setStatus("Copied."))
   .catch(()=>setStatus("Copy failed."));
 }else{
  setStatus("Copy is not supported in this browser.");
 }
}

function speakText(text){
 if(!("speechSynthesis" in window)){
  setStatus("Speech is not supported in this browser.");
  return;
 }

 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 const lang=document.getElementById("language").value;
 utterance.lang=lang==="Hindi"?"hi-IN":"en-IN";

 const voices=speechSynthesis.getVoices();
 const matching=voices.filter(v=>
  v.lang.toLowerCase().startsWith(lang==="Hindi"?"hi":"en")
 );

 const male=matching.find(v=>
  /male|man|david|mark|ravi|hemant|madhur/i.test(v.name)
 );

 if(male)utterance.voice=male;
 else if(matching.length)utterance.voice=matching[0];

 speechSynthesis.speak(utterance);
}

function toggleSpeech(){
 speechEnabled=!speechEnabled;
 setStatus(speechEnabled?"Voice output enabled":"Voice output disabled");
}

function startVoice(){
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!Recognition){
  alert("Voice input is not supported in this browser. Try Chrome.");
  return;
 }

 const recognition=new Recognition();
 const lang=document.getElementById("language").value;
 recognition.lang=lang==="Hindi"?"hi-IN":"en-IN";
 recognition.interimResults=false;

 recognition.onresult=e=>{
  const box=document.getElementById("prompt");
  box.value+=(box.value?" ":"")+e.results[0][0].transcript;
 };

 recognition.onerror=()=>setStatus("Voice input failed. Try again.");
 recognition.onend=()=>setStatus("Ready");
 recognition.start();
 setStatus("Listening...");
}

function openCamera(){
 document.getElementById("cameraInput").click();
}

function showAttachments(){
 const area=document.getElementById("attachment");
 area.innerHTML="";

 attachments.forEach((a,i)=>{
  const item=document.createElement("div");
  item.style.cssText="font-size:12px;color:#bbb;padding:5px";
  item.textContent=a.name+" ";

  const remove=document.createElement("button");
  remove.textContent="Remove";
  remove.className="smallbtn";
  remove.onclick=()=>{
   attachments.splice(i,1);
   showAttachments();
  };

  item.appendChild(remove);
  area.appendChild(item);
 });
}

async function uploadOriginalFileToDrive(file){
 if(!driveConnected)return;

 try{
  const form=new FormData();
  form.append("file",file,file.name);

  const response=await fetch(DRIVE_UPLOAD_URL,{
   method:"POST",
   body:form,
   credentials:"include"
  });

  const result=await response.json();
  if(!response.ok)throw new Error(result.error||"Upload failed");

  setStatus("Uploaded "+file.name+" to Google Drive.");
 }catch(error){
  setStatus("Drive upload failed: "+error.message);
 }
}

async function handleFiles(event){
 const files=Array.from(event.target.files||[]);

 for(const file of files){
  if(file.size>8*1024*1024){
   alert(file.name+" is larger than 8 MB.");
   continue;
  }

  if(driveConnected)uploadOriginalFileToDrive(file);

  try{
   if(file.type.startsWith("image/")){
    const data=await readAsDataURL(file);
    attachments.push({name:file.name,type:"image",data});
   }else if(file.type==="text/plain"||file.name.toLowerCase().endsWith(".txt")){
    attachments.push({name:file.name,type:"text",text:await file.text()});
   }else if(file.type==="application/pdf"||file.name.toLowerCase().endsWith(".pdf")){
    const text=await extractPDF(file);
    attachments.push({name:file.name,type:"text",text});
   }else if(file.name.toLowerCase().endsWith(".docx")){
    const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    attachments.push({name:file.name,type:"text",text:result.value});
   }else{
    alert("Unsupported file: "+file.name);
   }
  }catch(error){
   alert("Could not read "+file.name+": "+error.message);
  }
 }

 showAttachments();
 event.target.value="";
}

function readAsDataURL(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

async function extractPDF(file){
 const data=await file.arrayBuffer();
 const pdf=await pdfjsLib.getDocument({data}).promise;
 let result="";

 for(let i=1;i<=pdf.numPages;i++){
  const page=await pdf.getPage(i);
  const content=await page.getTextContent();
  result+=content.items.map(item=>item.str).join(" ")+"\n";
 }

 return result;
}

async function sendMessage(){
 if(busy)return;

 const input=document.getElementById("prompt");
 const text=input.value.trim();

 if(!text&&!attachments.length)return;
 if(!currentId)newChat();

 const images=attachments.filter(a=>a.type==="image");
 const documents=attachments.filter(a=>a.type==="text");

 let finalText=text;

 if(documents.length){
  finalText+="\n\nAttached document text:\n"+
   documents.map(d=>"--- "+d.name+" ---\n"+d.text.slice(0,20000)).join("\n\n");
 }

 if(!finalText&&images.length){
  finalText="Please examine the attached image.";
 }

 const firstImage=images[0]?.data||null;

 addStoredMessage("user",finalText,firstImage);
 input.value="";
 attachments=[];
 showAttachments();

 await requestAI();
}

async function requestAI(){
 const chat=activeChat();
 if(!chat)return;

 busy=true;
 document.getElementById("sendBtn").disabled=true;
 setStatus("Basanta is thinking...");

 const messages=chat.messages.slice(-20).map(m=>{
  if(m.role==="user"&&m.image){
   return {
    role:"user",
    content:[
     {type:"text",text:m.text||"Please examine this image."},
     {type:"image_url",image_url:{url:m.image}}
    ]
   };
  }

  return {role:m.role,content:m.text||""};
 });

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"Server error "+response.status);
  }

  const answer=
   data.choices?.[0]?.message?.content||
   data.response||
   data.result?.response||
   "I could not generate a response.";

  addStoredMessage("assistant",answer);

  if(speechEnabled)speakText(answer);
  setStatus("Ready");

 }catch(error){
  addStoredMessage("assistant",
   "Sorry, I could not connect to Basanta AI.\n\nError: "+error.message
  );
  setStatus("Connection error");
 }finally{
  busy=false;
  document.getElementById("sendBtn").disabled=false;
 }
}

async function regenerate(index){
 const chat=activeChat();
 if(!chat||busy||chat.messages[index]?.role!=="assistant")return;

 chat.messages=chat.messages.slice(0,index);
 saveChats();
 renderMessages();
 await requestAI();
}

function clearHistory(){
 if(!confirm("Delete all saved conversations?"))return;
 chats=[];
 currentId=null;
 saveChats();
 renderHistory();
 renderMessages();
}

function exportHistory(){
 const blob=new Blob([JSON.stringify(chats,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="basanta-conversations.json";
 a.click();
 URL.revokeObjectURL(url);
}

/* Google Drive integration */
function connectDrive(){
 window.location.href=API_BASE+"/oauth/start";
}

async function checkDriveStatus(){
 try{
  const response=await fetch(DRIVE_STATUS_URL,{credentials:"include"});
  const data=await response.json();
  driveConnected=!!data.connected;

  document.getElementById("driveBtn").textContent=
   driveConnected?"Drive connected":"Connect Drive";

  if(driveConnected){
   setStatus("Google Drive connected.");
  }
 }catch(e){
  driveConnected=false;
 }
}

function scheduleDriveBackup(){
 if(!driveConnected)return;
 clearTimeout(backupTimer);
 backupTimer=setTimeout(backupNow,2500);
}

async function backupNow(){
 if(!chats.length){
  setStatus("There are no conversations to back up yet.");
  return;
 }

 if(!driveConnected){
  setStatus("Connect Google Drive first.");
  return;
 }

 setStatus("Backing up conversations to Google Drive...");

 try{
  const response=await fetch(DRIVE_BACKUP_URL,{
   method:"POST",
   credentials:"include",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    app:"Basanta_Model",
    version:1,
    backupDate:new Date().toISOString(),
    chats
   })
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"Backup failed");
  }

  setStatus("Chat backup saved to Google Drive.");

 }catch(error){
  setStatus("Backup failed: "+error.message);
 }
}

document.getElementById("prompt").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

if(chats.length){
 currentId=chats[0].id;
}else{
 newChat();
}

renderHistory();
renderMessages();
checkDriveStatus();

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
 });
}
</script>
</body>
</html>
